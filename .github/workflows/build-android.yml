name: Build HGhub APK (arm64 release)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: Checkout builder repo
        uses: actions/checkout@v4

      - name: Prepare HGhub source (vendored snapshot)
        run: |
          # 上游仓库 2026-11-10 已清空（仅剩 README），改用自存档的 v1.2.1 源码快照
          mkdir -p app
          unzip -q vendor/hghub-src.zip -d app
          echo "source files: $(find app -type f | wc -l)"
          grep -E '"version"|minSdkVersion' app/package.json app/src-tauri/tauri.conf.json || true

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm 10
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: true

      - name: Install NDK
        run: |
          yes | sdkmanager --install "ndk;27.0.12077973" > /dev/null 2>&1 || echo "NDK 27 install failed"
          yes | sdkmanager --install "ndk;26.3.11579264" > /dev/null 2>&1 || echo "NDK 26 install failed"
          echo "--- installed NDKs ---"
          ls "$ANDROID_SDK_ROOT/ndk" || true
          NDK_DIR="$ANDROID_SDK_ROOT/ndk/27.0.12077973"
          if [ ! -d "$NDK_DIR" ]; then NDK_DIR="$ANDROID_SDK_ROOT/ndk/26.3.11579264"; fi
          echo "NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "using NDK: $NDK_DIR"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target
          key: android-arm64

      - name: pnpm install
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Init Android project
        working-directory: app
        run: pnpm exec tauri android init --ci

      - name: Generate release keystore and inject signing config
        working-directory: app
        env:
          KS_PASS: hghub_selfuse_2026
        run: |
          keytool -genkeypair -v \
            -keystore src-tauri/gen/android/hghub.jks \
            -storepass "$KS_PASS" -keypass "$KS_PASS" \
            -alias hghub -keyalg RSA -keysize 2048 -validity 36500 \
            -dname "CN=hghub, OU=personal, O=self-use, L=local, S=local, C=CN"
          python3 - <<'PYEOF'
          import re
          p = 'src-tauri/gen/android/app/build.gradle.kts'
          s = open(p, encoding='utf-8').read()
          print('--- 原始 build.gradle.kts ---')
          print(s)
          print('--- 结束 ---')
          # 关闭 release 的 R8 混淆：R8 会裁剪/混淆 Rust 通过 JNI 反射调用的
          # Kotlin 桥接类，导致前端调不到 Rust 命令，表现为 app 打开后无内容。
          # 关掉后 dex 不裁剪不混淆，包体略增但功能完整。
          if 'isMinifyEnabled = true' in s:
              s = s.replace('isMinifyEnabled = true', 'isMinifyEnabled = false')
              print('已关闭 release R8 混淆')
          if 'signingConfigs' in s:
              print('已存在 signingConfigs，跳过注入')
          else:
              ks_pass = 'hghub_selfuse_2026'
              signing_block = (
                  '    signingConfigs {\n'
                  '        create("release") {\n'
                  f'            storeFile = file("../hghub.jks")\n'
                  f'            storePassword = "{ks_pass}"\n'
                  '            keyAlias = "hghub"\n'
                  f'            keyPassword = "{ks_pass}"\n'
                  '        }\n'
                  '    }\n'
              )
              # 在 android { 块内、buildTypes 之前插入 signingConfigs
              assert 'android {' in s, '未能定位 android 块'
              s = s.replace('android {', 'android {\n' + signing_block, 1)
              # 给 release buildType 挂上签名。Tauri 模板中 buildTypes 里
              # 先定义 debug 再定义 release，所以直接锚定 getByName("release")
              # 本身，不假设它紧跟 buildTypes {
              s2, n = re.subn(
                  r'(getByName\("release"\)\s*\{)',
                  r'\1\n            signingConfig = signingConfigs.getByName("release")',
                  s, count=1)
              if n == 0:
                  # 兜底：其他形式的 release 块
                  s2, n = re.subn(
                      r'(\brelease\s*\{)',
                      r'\1\n            signingConfig = signingConfigs.getByName("release")',
                      s, count=1)
              assert n > 0, '未能定位 release buildType'
              open(p, 'w', encoding='utf-8').write(s2)
              print('签名配置已注入 build.gradle.kts')
          PYEOF
          echo '--- build.gradle.kts 签名相关片段 ---'
          grep -n -A6 "signingConfigs\|signingConfig" src-tauri/gen/android/app/build.gradle.kts || true

      - name: Build release APK (arm64)
        working-directory: app
        run: pnpm exec tauri android build --apk --target aarch64

      - name: Collect APK
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out"
          find app/src-tauri/gen/android/app/build/outputs -name "*.apk" -print
          find app/src-tauri/gen/android/app/build/outputs -name "*.apk" -exec cp {} "$GITHUB_WORKSPACE/out/" \;
          cd "$GITHUB_WORKSPACE/out"
          rm -f HGhub-arm64-release.apk
          cp "$(ls *.apk | head -1)" HGhub-arm64-release.apk
          rm -f $(ls *.apk | grep -v HGhub || true)
          ls -lh

      - name: Verify APK signature
        run: |
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner"
          "$APKSIGNER" verify --print-certs out/HGhub-arm64-release.apk && echo "签名校验通过" || echo "签名校验失败（不影响上传）"

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hghub-arm64-apk
          path: out/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Publish release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-arm64-${{ github.run_number }}
          name: HGhub arm64 Release APK (build ${{ github.run_number }})
          body: |
            单架构（arm64-v8a）release 优化构建，自签证书签名。
            仅限个人学习自用，遵循上游 PolyForm Noncommercial 1.0.0 许可证，禁止商业使用。
          files: out/*.apk
          fail_on_unmatched_files: false
